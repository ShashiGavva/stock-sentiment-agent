<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Trading Workstation - Stock Sentiment Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            color: #e4e4e7;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .market-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .market-status.open { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .market-status.closed { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .market-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #10b981;
        }

        /* Watchlist */
        .watchlist-input {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .watchlist-input input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
            font-size: 0.9rem;
        }

        .watchlist-input input::placeholder {
            color: #71717a;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .watchlist-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #10b981;
        }

        .chip-remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.7;
        }

        .chip-remove:hover {
            opacity: 1;
        }

        /* Scanner Controls */
        .scanner-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .control-group select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
            font-size: 0.9rem;
        }

        .scanner-status {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            text-align: center;
        }

        .scanner-status.scanning {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Signals Grid */
        .signals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .signal-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .signal-card:hover {
            transform: translateY(-2px);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .signal-card.buy {
            border-left: 3px solid #10b981;
        }

        .signal-card.sell {
            border-left: 3px solid #ef4444;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .signal-symbol {
            font-size: 1.5rem;
            font-weight: 700;
            color: #06b6d4;
        }

        .signal-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .signal-badge.buy {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .signal-badge.sell {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .signal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .signal-reason {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        .signal-levels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .level {
            text-align: center;
        }

        .level-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .level-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .level-value.entry {
            color: #06b6d4;
        }

        .level-value.stop {
            color: #ef4444;
        }

        .level-value.target {
            color: #10b981;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 10px;
        }

        /* Position Tracking */
        .position-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .position-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #10b981;
        }

        .position-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .form-group input {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
        }

        .position-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .position-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .position-info-label {
            color: #94a3b8;
        }

        .position-info-value {
            color: #e4e4e7;
            font-weight: 600;
        }

        .pnl-display {
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .pnl-display.profit {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .pnl-display.loss {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* Weekly P&L Stats */
        .pnl-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .pnl-stat {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            text-align: center;
        }

        .pnl-stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .pnl-stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .pnl-stat-value.positive {
            color: #10b981;
        }

        .pnl-stat-value.negative {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #71717a;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .signals-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <h1>⚡ Day Trading Workstation</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="market-status {{ market_status.status|lower }}">
                    <span class="dot"></span>
                    <span>{{ market_status.message }}</span>
                </div>
                <a href="/" class="btn btn-secondary" style="text-decoration: none;">← Back</a>
            </div>
        </header>

        <div class="dashboard">
            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Watchlist Panel -->
                <div class="panel">
                    <div class="panel-title">📋 Watchlist (Max 10)</div>
                    <div class="watchlist-input">
                        <input type="text" id="ticker-input" placeholder="Enter ticker (e.g., AAPL)" maxlength="5">
                        <button class="btn btn-primary" id="add-ticker-btn">Add</button>
                    </div>
                    <div class="watchlist-chips" id="watchlist-chips">
                        <!-- Chips will be added here dynamically -->
                    </div>
                </div>

                <!-- Scanner Controls -->
                <div class="panel">
                    <div class="panel-title">🔍 Scanner Settings</div>
                    <div class="scanner-controls">
                        <div class="control-group">
                            <label>Time Interval</label>
                            <select id="interval-select">
                                <option value="1m">1 Minute</option>
                                <option value="5m" selected>5 Minutes</option>
                                <option value="15m">15 Minutes</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Scan Frequency</label>
                            <select id="frequency-select">
                                <option value="60" selected>Every 1 minute</option>
                                <option value="300">Every 5 minutes</option>
                            </select>
                        </div>

                        <button class="btn btn-primary" id="start-btn" style="width: 100%;">
                            ▶ Start Scanning
                        </button>

                        <button class="btn btn-danger" id="stop-btn" style="width: 100%; display: none;">
                            ⏸ Stop Scanning
                        </button>

                        <button class="btn" id="retrain-btn" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;" onclick="triggerRetrain()">
                            🔄 Retrain Models (Weekly)
                        </button>

                        <div class="scanner-status" id="scanner-status">
                            Idle
                        </div>
                        <div class="scanner-status" id="retrain-status" style="display: none;">
                            Retraining in progress...
                        </div>
                    </div>
                </div>

                <!-- Weekly P&L -->
                <div class="panel">
                    <div class="panel-title">📊 This Week's P&L</div>
                    <div id="weekly-pnl">
                        <div class="pnl-stats">
                            <div class="pnl-stat">
                                <div class="pnl-stat-label">Total P&L</div>
                                <div class="pnl-stat-value" id="pnl-total">$0.00</div>
                            </div>
                            <div class="pnl-stat">
                                <div class="pnl-stat-label">Win Rate</div>
                                <div class="pnl-stat-value" id="pnl-winrate">0%</div>
                            </div>
                            <div class="pnl-stat">
                                <div class="pnl-stat-label">Trades</div>
                                <div class="pnl-stat-value" id="pnl-trades">0</div>
                            </div>
                            <div class="pnl-stat">
                                <div class="pnl-stat-label">Winners</div>
                                <div class="pnl-stat-value positive" id="pnl-winners">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div id="signals-container">
                    <div class="empty-state">
                        <h3>No Signals Yet</h3>
                        <p>Add stocks to your watchlist and start scanning</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pollInterval = null;
        let watchlist = [];

        // Audio notification sounds
        const successSound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZQQ0PVKzn8Kxd');
        const errorSound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAgYCFhYWEg4ODgoGBgYGCg4SFhYaHh4iJiYqLi4yMjY2Oj5CRkpKTlJWVlpeYmZqanJ2en6ChoqOkpaanqKmqq6ytrq+wsbKztLW2t7i5urq7vL2+v8DBwsLDxMXGx8jIycrLzM3Oz9DR0tLT1NXW19jZ2trc3d7f4OHi4+Tl5ufo6err');

        // Initialize
        async function init() {
            await loadWatchlist();
            checkStatus();
            pollInterval = setInterval(checkStatus, 2000);
        }

        // Load watchlist from server
        async function loadWatchlist() {
            try {
                const response = await fetch('/api/daytrading/watchlist');
                const data = await response.json();
                watchlist = data.watchlist || [];
                renderWatchlist();
            } catch (error) {
                console.error('Error loading watchlist:', error);
            }
        }

        // Render watchlist chips
        function renderWatchlist() {
            const container = document.getElementById('watchlist-chips');
            container.innerHTML = '';

            if (watchlist.length === 0) {
                container.innerHTML = '<div style="color: #71717a; font-size: 0.85rem;">Add tickers to start</div>';
                return;
            }

            watchlist.forEach(symbol => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = `
                    <span>${symbol}</span>
                    <span class="chip-remove" onclick="removeTicker('${symbol}')">×</span>
                `;
                container.appendChild(chip);
            });
        }

        // Add ticker to watchlist
        async function addTicker() {
            const input = document.getElementById('ticker-input');
            const symbol = input.value.toUpperCase().trim();

            if (!symbol) return;

            if (watchlist.length >= 10) {
                alert('Watchlist limit (10 stocks) reached');
                return;
            }

            try {
                const response = await fetch('/api/daytrading/watchlist/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol })
                });

                const data = await response.json();
                if (data.success) {
                    watchlist = data.watchlist;
                    renderWatchlist();
                    input.value = '';
                }
            } catch (error) {
                console.error('Error adding ticker:', error);
            }
        }

        // Remove ticker from watchlist
        async function removeTicker(symbol) {
            try {
                const response = await fetch('/api/daytrading/watchlist/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol })
                });

                const data = await response.json();
                if (data.success) {
                    watchlist = data.watchlist;
                    renderWatchlist();
                }
            } catch (error) {
                console.error('Error removing ticker:', error);
            }
        }

        // Start continuous scanning
        async function startScanning() {
            if (watchlist.length === 0) {
                alert('Please add stocks to your watchlist first');
                return;
            }

            const interval = document.getElementById('interval-select').value;
            const frequency = parseInt(document.getElementById('frequency-select').value);

            try {
                const response = await fetch('/api/daytrading/scan/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval, frequency })
                });

                if (response.ok) {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                }
            } catch (error) {
                console.error('Error starting scan:', error);
            }
        }

        // Stop scanning
        async function stopScanning() {
            try {
                const response = await fetch('/api/daytrading/scan/stop', {
                    method: 'POST'
                });

                if (response.ok) {
                    document.getElementById('start-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }
            } catch (error) {
                console.error('Error stopping scan:', error);
            }
        }

        // Trigger model retraining
        async function triggerRetrain() {
            if (!confirm('This will retrain the ML models based on your recent trades. This may take several minutes. Continue?')) {
                return;
            }

            const retrainBtn = document.getElementById('retrain-btn');
            const retrainStatus = document.getElementById('retrain-status');
            const scannerStatus = document.getElementById('scanner-status');

            try {
                // Disable button and show status
                retrainBtn.disabled = true;
                retrainBtn.textContent = '⏳ Retraining...';
                scannerStatus.style.display = 'none';
                retrainStatus.style.display = 'block';
                retrainStatus.className = 'scanner-status scanning';

                const response = await fetch('/api/daytrading/retrain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: 7 })  // Use past 7 days
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Models retrained successfully!\n\n` +
                          `Trades processed: ${data.trades_processed}\n` +
                          `Training samples: ${data.training_samples}\n` +
                          `Timestamp: ${new Date(data.timestamp).toLocaleString()}`);
                    retrainStatus.textContent = `✅ Last retrain: ${new Date().toLocaleString()}`;
                    retrainStatus.className = 'scanner-status';
                } else {
                    alert(`❌ Retraining failed: ${data.error}`);
                    retrainStatus.textContent = `❌ Retraining failed`;
                    retrainStatus.className = 'scanner-status';
                }

            } catch (error) {
                console.error('Error retraining models:', error);
                alert(`❌ Error: ${error.message}`);
                retrainStatus.textContent = `❌ Error during retraining`;
                retrainStatus.className = 'scanner-status';
            } finally {
                // Re-enable button
                retrainBtn.disabled = false;
                retrainBtn.textContent = '🔄 Retrain Models (Weekly)';

                // Show scanner status again after 5 seconds
                setTimeout(() => {
                    retrainStatus.style.display = 'none';
                    scannerStatus.style.display = 'block';
                }, 5000);
            }
        }

        // Check scan status
        async function checkStatus() {
            try {
                const response = await fetch('/api/daytrading/status');
                const data = await response.json();

                // Update status
                const statusEl = document.getElementById('scanner-status');
                if (data.scanning) {
                    statusEl.className = 'scanner-status scanning';
                    statusEl.textContent = `Scanning ${data.current_ticker || '...'}`;
                } else if (data.status === 'complete') {
                    statusEl.className = 'scanner-status';
                    statusEl.textContent = `Last scan: ${data.last_run || 'Never'}`;
                } else {
                    statusEl.className = 'scanner-status';
                    statusEl.textContent = 'Idle';
                }

                // Update signals
                if (data.signals && data.signals.length > 0) {
                    renderSignals(data.signals);
                }

                // Update button states
                if (data.scanning) {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                } else {
                    document.getElementById('start-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }

            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        // Render signals
        function renderSignals(signals) {
            const container = document.getElementById('signals-container');

            if (signals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Signals Found</h3>
                        <p>No trading opportunities at this time</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="signals-grid" id="signals-grid"></div>';
            const grid = document.getElementById('signals-grid');

            signals.forEach((signal, index) => {
                const card = createSignalCard(signal, index);
                grid.appendChild(card);
            });
        }

        // Create signal card with chart
        function createSignalCard(signal, index) {
            const card = document.createElement('div');
            card.className = `signal-card ${signal.signal.toLowerCase()}`;
            card.dataset.signalId = signal.signal_id;

            const rrColor = signal.risk_reward >= 2 ? '#10b981' : signal.risk_reward >= 1.5 ? '#eab308' : '#ef4444';

            let positionHTML = '';
            if (signal.has_position && signal.position_data) {
                // Position exists - show close position form
                const posData = signal.position_data;
                positionHTML = `
                    <div class="position-section">
                        <div class="position-section-title">📍 Active Position</div>
                        <div class="position-info">
                            <div class="position-info-row">
                                <span class="position-info-label">Bought At:</span>
                                <span class="position-info-value">$${posData.buy_price}</span>
                            </div>
                            <div class="position-info-row">
                                <span class="position-info-label">Amount:</span>
                                <span class="position-info-value">$${posData.amount}</span>
                            </div>
                            <div class="position-info-row">
                                <span class="position-info-label">Entry Time:</span>
                                <span class="position-info-value">${new Date(posData.entry_time).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="position-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Sell Price</label>
                                    <input type="number" step="0.01" placeholder="Exit price" id="sell-price-${signal.signal_id}">
                                </div>
                                <div class="form-group">
                                    <label>Quantity (Optional)</label>
                                    <input type="number" step="1" placeholder="Leave empty for full position" id="sell-quantity-${signal.signal_id}">
                                </div>
                            </div>
                            <button class="btn btn-danger btn-small" onclick="closePosition('${signal.signal_id}')">
                                Close Position
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // No position - show entry form
                positionHTML = `
                    <div class="position-section">
                        <div class="position-section-title">💰 Enter Position</div>
                        <div class="position-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Buy Price</label>
                                    <input type="number" step="0.01" value="${signal.entry}" id="buy-price-${signal.signal_id}">
                                </div>
                                <div class="form-group">
                                    <label>Amount ($)</label>
                                    <input type="number" step="1" placeholder="1000" id="amount-${signal.signal_id}">
                                </div>
                            </div>
                            <button class="btn btn-primary btn-small" onclick="openPosition('${signal.signal_id}')">
                                Enter Position
                            </button>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="signal-header">
                    <div class="signal-symbol">${signal.symbol}</div>
                    <div class="signal-badge ${signal.signal.toLowerCase()}">${signal.signal}</div>
                </div>

                <div class="signal-meta">
                    <span>📊 ${signal.indicator}</span>
                    <span>💪 ${signal.strength}</span>
                    <span>📈 R:R ${signal.risk_reward}:1</span>
                </div>

                <div class="signal-reason">${signal.reason}</div>

                <div class="signal-levels">
                    <div class="level">
                        <div class="level-label">Entry</div>
                        <div class="level-value entry">$${signal.entry}</div>
                    </div>
                    <div class="level">
                        <div class="level-label">Stop</div>
                        <div class="level-value stop">$${signal.stop}</div>
                    </div>
                    <div class="level">
                        <div class="level-label">Target</div>
                        <div class="level-value target">$${signal.target}</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="chart-${index}"></canvas>
                </div>

                ${positionHTML}
            `;

            // Render chart after card is added to DOM
            setTimeout(() => {
                renderCandlestickChart(signal, `chart-${index}`);
            }, 100);

            return card;
        }

        // Render candlestick chart
        function renderCandlestickChart(signal, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !signal.candlestick_data) return;

            const ctx = canvas.getContext('2d');

            // Prepare data
            const data = signal.candlestick_data.map(candle => ({
                x: new Date(candle.timestamp),
                o: candle.open,
                h: candle.high,
                l: candle.low,
                c: candle.close
            }));

            new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: signal.symbol,
                        data: data,
                        color: {
                            up: '#10b981',
                            down: '#ef4444',
                            unchanged: '#94a3b8'
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            display: false
                        },
                        y: {
                            position: 'right',
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        // Open a position
        async function openPosition(signalId) {
            const buyPrice = parseFloat(document.getElementById(`buy-price-${signalId}`).value);
            const amount = parseFloat(document.getElementById(`amount-${signalId}`).value);

            if (!buyPrice || !amount) {
                alert('Please enter both buy price and amount');
                return;
            }

            try {
                const response = await fetch('/api/daytrading/position/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        signal_id: signalId,
                        buy_price: buyPrice,
                        amount: amount
                    })
                });

                const data = await response.json();
                if (data.success) {
                    // Refresh signals to show updated position
                    await checkStatus();
                    await loadWeeklyPnL();
                } else {
                    alert(data.error || 'Failed to open position');
                }
            } catch (error) {
                console.error('Error opening position:', error);
                alert('Failed to open position');
            }
        }

        // Close a position
        async function closePosition(signalId) {
            const sellPrice = parseFloat(document.getElementById(`sell-price-${signalId}`).value);
            const quantityInput = document.getElementById(`sell-quantity-${signalId}`);
            const quantity = quantityInput && quantityInput.value ? parseFloat(quantityInput.value) : null;

            if (!sellPrice) {
                alert('Please enter sell price');
                return;
            }

            if (quantity !== null && quantity <= 0) {
                alert('Quantity must be greater than 0 or left empty for full position');
                return;
            }

            try {
                const payload = {
                    signal_id: signalId,
                    sell_price: sellPrice
                };

                // Add quantity if specified (for partial close)
                if (quantity !== null) {
                    payload.quantity = quantity;
                }

                const response = await fetch('/api/daytrading/position/close', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.success) {
                    // Play audio notification
                    const pnl = data.profit_loss;
                    try {
                        if (pnl >= 0) {
                            successSound.play().catch(e => console.log('Audio play failed:', e));
                        } else {
                            errorSound.play().catch(e => console.log('Audio play failed:', e));
                        }
                    } catch (e) {
                        console.log('Audio notification failed:', e);
                    }

                    // Show P&L alert
                    const pnlPercent = data.profit_loss_percent;
                    const message = pnl >= 0
                        ? `✅ Position closed with profit: $${pnl.toFixed(2)} (${pnlPercent.toFixed(2)}%)`
                        : `❌ Position closed with loss: $${pnl.toFixed(2)} (${pnlPercent.toFixed(2)}%)`;
                    alert(message);

                    // Refresh signals and P&L
                    await checkStatus();
                    await loadWeeklyPnL();
                } else {
                    alert(data.error || 'Failed to close position');
                }
            } catch (error) {
                console.error('Error closing position:', error);
                alert('Failed to close position');
            }
        }

        // Load weekly P&L
        async function loadWeeklyPnL() {
            try {
                const response = await fetch('/api/daytrading/pnl/weekly');
                const data = await response.json();

                // Update P&L display
                const totalEl = document.getElementById('pnl-total');
                totalEl.textContent = `$${data.total_pnl.toFixed(2)}`;
                totalEl.className = 'pnl-stat-value ' + (data.total_pnl >= 0 ? 'positive' : 'negative');

                document.getElementById('pnl-winrate').textContent = `${data.win_rate.toFixed(1)}%`;
                document.getElementById('pnl-trades').textContent = data.num_trades;
                document.getElementById('pnl-winners').textContent = data.winning_trades;

            } catch (error) {
                console.error('Error loading weekly P&L:', error);
            }
        }

        // Event listeners
        document.getElementById('add-ticker-btn').addEventListener('click', addTicker);
        document.getElementById('ticker-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTicker();
        });
        document.getElementById('start-btn').addEventListener('click', startScanning);
        document.getElementById('stop-btn').addEventListener('click', stopScanning);

        // Initialize on page load
        init();
        loadWeeklyPnL();
        // Refresh P&L every 30 seconds
        setInterval(loadWeeklyPnL, 30000);
    </script>
</body>
</html>
