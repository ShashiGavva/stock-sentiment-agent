<!DOCTYPE html>
<html>
  <body style="font-family:Segoe UI,Arial,sans-serif;background:#f5f6f7;margin:0;padding:24px;color:#1b1b1b">
    <div style="max-width:920px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,0.08);padding:24px;border:1px solid #e6e8ee;">
      <h2 style="margin-top:0;margin-bottom:4px;font-weight:700;">Today’s Best Stocks to Buy</h2>
      <div style="color:#666;font-size:13px;margin-bottom:16px;">$DATE • Only strong, rising stocks within buy zone today.</div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <div style="flex:1;min-width:220px;background:#e9f2ff;border-radius:10px;padding:12px 14px;border:1px solid #cfe0ff;">
          <div style="font-size:12px;color:#3366cc;">Longs selected</div>
          <div style="font-size:22px;font-weight:700;color:#003366;">$COUNT</div>
        </div>
      </div>

      <h3 style="margin:18px 0 14px;">Top Long Opportunities</h3>

      <!-- Extra scroll wrapper for email clients that ignore inner wrapper -->
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #d7dbe6;border-radius:10px;">
        $TABLE
      </div>

      <div style="font-size:12px;color:#666;line-height:1.6;margin-top:18px;">
        Picks are trending up, inside entry zone, and showing strong momentum.
        Entry/Stop/Target derived from ATR(14). Educational use only — not financial advice.
      </div>
    </div>
  </body>
</html>
